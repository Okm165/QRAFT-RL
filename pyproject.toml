# One root uv project, no package. The lockfile is the reproducibility contract.
# The pinned torch source is the verified ROCm index; adjust the index/source
# mapping for a different accelerator backend.

[project]
name = "qraft-rl"
version = "0.1.0"
description = "RAFT-based grounded Q&A fine-tuning pipeline for Qwen3.8-27B on AMD GPUs"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "QRAFT-RL contributors" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.13.0",
    "triton-rocm==3.7.1; sys_platform == 'linux'",
    "transformers==5.20.2",
    "peft==0.21.2",
    "bitsandbytes==0.50.2",
    "accelerate==1.15.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.1"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }
pytorch-triton-rocm = { index = "pytorch-rocm" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore:.*torch.jit.script_method.*is deprecated.*:DeprecationWarning",
]
